name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch; CUDA/ROM tests auto-skip)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,rl]' --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: |
          pip install ruff
          ruff check .

      - name: Test
        run: python -m pytest tests/ -q
